development:
  adapter: async
  url: redis://localhost:6379/1
  allowed_request_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - https://unstaggering-nonresidential-adelle.ngrok-free.dev

# production 環境の設定例
production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: music_calling_app_production
  allowed_request_origins:
    - https://your-production-domain.com
